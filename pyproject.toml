[project]
name = "beam-ja-yomi-bench"
version = "0.1.0"
description = "Can Beam fix the misreadings of a Japanese TTS front end (OpenJTalk)?"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "openai>=1.60",
    "python-dotenv>=1.0",
    "pyopenjtalk-plus[onnxruntime]==0.4.1.post9",
    "huggingface_hub>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]
space = ["gradio==6.26.0", "piper-plus[cpu]==2.0.2", "numpy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yomibench"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # third-party: pyopenjtalk-plus 0.4.1.post9 calls sudachipy's deprecated Dictionary.create()
    'ignore:Dictionary.create\(\) is deprecated:DeprecationWarning',
]
